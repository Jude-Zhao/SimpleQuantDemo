[project]
name = "simple-quant-demo"
version = "0.1.0"
description = "A minimal multi-factor ETF weekly rotation research and signal system."
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
