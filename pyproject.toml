[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-quant-demo"
version = "0.1.0"
description = "A minimal multi-factor ETF weekly rotation research and signal system."
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.0",
    "baostock>=0.8.8",
    "fastapi>=0.100.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "quantstats>=0.0.81",
    "scipy>=1.10.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["core*", "research*", "trading*", "webapp*"]
exclude = ["data_example*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
