server:
  host: "127.0.0.1"
  port: 8000

database:
  url: "sqlite:///./data/simple_quant.db"

datasource:
  primary: "akshare"
  cache_enabled: true
  cache_days_daily: 365
  jump_threshold: 45.0
  tencent_min_interval: 0.75
  tencent_max_interval: 1.25
  source_break_threshold: 3

sync:
  default_start_date: "2021-01-04"

factors:
  auto_discover: true
  scan_package: "core.factors"

strategy:
  max_history_runs: 100
